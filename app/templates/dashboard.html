<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callifex Admin | Müşteri Adayları (Leads)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .table-dark { background-color: #1e293b; }
    </style>
</head>
<body class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>📊 Callifex Lead Yönetim Paneli</h2>
        <a href="/" class="btn btn-outline-primary">Karşılama Sayfasına Dön</a>
    </div>

    <div class="card bg-dark text-white border-secondary">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-dark table-hover align-middle mb-0">
                    <thead>
                        <tr class="text-primary">
                            <th>İsim (F-Pattern Sol)</th>
                            <th>Telefon</th>
                            <th>E-Posta</th>
                            <th>Kariyer Hedefi</th>
                            <th>Tarih</th>
                        </tr>
                    </thead>
                    <tbody id="leadTableBody">
                        <tr><td colspan="5" class="text-center">Kayıtlar yükleniyor...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

<script>
async function leadsYukle() {
    try {
        const res = await fetch('/api/leads');
        const data = await res.json();
        const tbody = document.getElementById('leadTableBody');

        if(data.basari && data.veri.length > 0) {
            tbody.innerHTML = data.veri.map(item => `
                <tr>
                    <td class="fw-bold">${item.isim}</td>
                    <td>${item.telefon}</td>
                    <td>${item.email}</td>
                    <td><span class="badge bg-secondary">${item.kariyer_hedefi || '-'}</span></td>
                    <td class="small text-muted">${item.tarih}</td>
                </tr>
            `).join('');
        } else {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Henüz kayıtlı lead bulunmuyor.</td></tr>';
        }
    } catch(e) {
        document.getElementById('leadTableBody').innerHTML = '<tr><td colspan="5" class="text-center text-danger">Veriler yüklenirken hata oluştu.</td></tr>';
    }
}

leadsYukle();
</script>
</body>
</html>
